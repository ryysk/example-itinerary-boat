<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnival Paradise Family Cruise Guide</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --navy: #0f2b48;
      --navy-light: #1e3a5f;
      --accent: #0284c7;
      --accent-subtle: #e0f2fe;
      --coral: #e11d48;
      --coral-subtle: #ffe4e6;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 2rem 2.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
    }

    .header-eyebrow {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .nav {
      display: flex;
      gap: 0.5rem;
      background: #e2e8f0;
      padding: 0.35rem;
      border-radius: 10px;
      margin-bottom: 1.75rem;
      overflow-x: auto;
    }

    .nav button {
      flex: 1;
      min-width: 140px;
      background: none;
      border: none;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .nav button:hover {
      color: var(--text-main);
    }

    .nav button.active {
      background: var(--surface);
      color: var(--navy);
      box-shadow: var(--shadow-sm);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block !important;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--navy);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .info-item {
      background: var(--surface-subtle);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .info-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .alert {
      border-left: 4px solid var(--accent);
      background: var(--accent-subtle);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin-top: 1rem;
      font-size: 0.92rem;
    }

    .alert.warning {
      border-left-color: var(--coral);
      background: var(--coral-subtle);
      color: #881337;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 0.85rem;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    details[open] {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    summary {
      padding: 1.1rem 1.25rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      background: var(--surface);
    }

    summary::-webkit-details-marker { display: none; }

    summary .day-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: var(--surface-subtle);
      color: var(--navy);
      border: 1px solid var(--border);
    }

    summary::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      transform: rotate(45deg);
      transition: transform 0.2s ease;
      margin-left: 1rem;
    }

    details[open] summary::after {
      transform: rotate(-135deg);
    }

    .day-content {
      padding: 0.75rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .timeline-item {
      display: flex;
      gap: 1.25rem;
      padding: 0.75rem 0;
      border-bottom: 1px dashed var(--border);
    }

    .timeline-item:last-child {
      border-bottom: none;
      padding-bottom: 0.25rem;
    }

    .time-slot {
      min-width: 75px;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--accent);
      padding-top: 0.15rem;
    }

    .event-desc {
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background: var(--surface);
    }

    th {
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    tr:last-child td { border-bottom: none; }
    td strong { color: var(--navy); }

    .checklist-group {
      margin-bottom: 1.5rem;
    }

    .checklist-group:last-child {
      margin-bottom: 0;
    }

    .group-header {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
    }

    ul.check-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    ul.check-list li {
      display: flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      transition: all 0.15s ease;
    }

    ul.check-list li:hover {
      border-color: var(--border-focus);
    }

    ul.check-list input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #94a3b8;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      margin-right: 0.85rem;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    ul.check-list input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    ul.check-list input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 5px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    ul.check-list label {
      font-size: 0.92rem;
      cursor: pointer;
      user-select: none;
      flex: 1;
    }

    ul.check-list input[type="checkbox"]:checked + label {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    @media (max-width: 600px) {
      body { padding: 1rem 0.5rem; }
      header { padding: 1.5rem; }
      .timeline-item { flex-direction: column; gap: 0.25rem; }
      .time-slot { min-width: auto; }
    }
  </style>
</head>

        <span>Tampa to Cozumel</span>

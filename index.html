<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnival Paradise Family Cruise Guide</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --navy: #0f2b48;
      --navy-light: #1e3a5f;
      --accent: #0284c7;
      --accent-subtle: #e0f2fe;
      --coral: #e11d48;
      --coral-subtle: #ffe4e6;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 2rem 2.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
    }

    .header-eyebrow {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    /* CSS-Only Radio Tab Bar */
    input.tab-control {
      display: none;
    }

    .tab-bar {
      display: flex;
      gap: 0.5rem;
      background: #e2e8f0;
      padding: 0.35rem;
      border-radius: 10px;
      margin-bottom: 1.75rem;
      overflow-x: auto;
    }

    .tab-label {
      flex: 1;
      min-width: 140px;
      text-align: center;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .tab-label:hover {
      color: var(--text-main);
    }

    /* Tab selection states */
    #tab-radio-logistics:checked ~ .tab-bar label[for="tab-radio-logistics"],
    #tab-radio-itinerary:checked ~ .tab-bar label[for="tab-radio-itinerary"],
    #tab-radio-dining:checked ~ .tab-bar label[for="tab-radio-dining"],
    #tab-radio-packing:checked ~ .tab-bar label[for="tab-radio-packing"] {
      background: var(--surface);
      color: var(--navy);
      box-shadow: var(--shadow-sm);
    }

    /* Panels Display Rules */
    .panel {
      display: none;
    }

    #tab-radio-logistics:checked ~ #logistics,
    #tab-radio-itinerary:checked ~ #itinerary,
    #tab-radio-dining:checked ~ #dining,
    #tab-radio-packing:checked ~ #packing {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--navy);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .info-item {
      background: var(--surface-subtle);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .info-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .alert {
      border-left: 4px solid var(--accent);
      background: var(--accent-subtle);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin-top: 1rem;
      font-size: 0.92rem;
    }

    .alert.warning {
      border-left-color: var(--coral);
      background: var(--coral-subtle);
      color: #881337;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 0.85rem;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    details[open] {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    summary {
      padding: 1.1rem 1.25rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      background: var(--surface);
    }

    summary::-webkit-details-marker { display: none; }
